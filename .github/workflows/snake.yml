name: Generate Snake

on:
  schedule:
    # هر 12 ساعت یکبار خودش آپدیت میشه
    - cron: "0 */12 * * *"
  workflow_dispatch: # برای اینکه بتونی دستی هم دکمه بزنی و اجرا کنی

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          # حتماً یوزرنیم بدون فاصله بنویس
          github_user_name: kiyan-rahmati
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
