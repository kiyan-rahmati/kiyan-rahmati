name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-snake.svg?palette=github-light
            assets/github-contribution-snake-dark.svg?palette=github-dark
      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          add: "assets/github-contribution-snake.svg assets/github-contribution-snake-dark.svg"
          message: "chore: update contribution snake"
